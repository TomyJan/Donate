name: Code checks

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:tooling
      - run: pnpm check:generated
      - run: python docs/design/build.py --check
      - run: pnpm --dir web build
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/webassets/dist/
          retention-days: 7
          if-no-files-found: error

  backend:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/webassets/dist/
      - name: Format, dependency consistency and vet
        run: |
          gofmt -l cmd internal > format-errors.txt
          if [ -s format-errors.txt ]; then cat format-errors.txt; exit 1; fi
          go mod tidy -diff
          go vet ./...
      - name: Tests with race detector
        if: runner.os == 'Linux'
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go run ./cmd/coveragecheck coverage.out
      - name: Windows database and path tests
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Reachable Go vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Native binary smoke
        run: |
          go build -trimpath -o donate-smoke ./cmd/donate
          ./donate-smoke --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Linux'
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7

  browser:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/webassets/dist/
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: go build -trimpath -o dist/donate ./cmd/donate
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
