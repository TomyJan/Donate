name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize version and create tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require credentials that can trigger tag push workflows
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Configure RELEASE_TOKEN with repository Contents read/write permission. GITHUB_TOKEN pushes cannot trigger the tag release workflow.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Commit and tag the next version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Version synchronization must run on the default branch.' >&2
            exit 1
          fi
          git fetch origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]; then
            echo 'Default branch changed; start a new version synchronization run.' >&2
            exit 1
          fi
          version=$(node scripts/release-version.mjs "$BUMP")
          node scripts/set-release-version.mjs "$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json cmd/donate/version.go
          git commit -m "chore(release): v$version"
          git tag "v$version"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$version"
          printf 'sha=%s\ntag=v%s\n' "$(git rev-parse HEAD)" "$version" >> "$GITHUB_OUTPUT"
