version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: gomod
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
